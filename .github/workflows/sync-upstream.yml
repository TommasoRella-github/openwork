name: Sync Fork with Upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "OpenWork Sync Bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/different-ai/openwork.git
          git fetch upstream

      - name: Merge upstream/dev into fork dev
        run: |
          git merge upstream/dev --no-edit --commit

      - name: Push to fork
        run: |
          git push origin dev
